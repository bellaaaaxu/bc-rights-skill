name: Weekly check of official sources

# Maintenance is automatic: nobody has to review anything. The check records what changed in sources.json; the skill
# (status.mjs, SKILL.md Step 0) and the chat packs then hold back only the facts that rest on a changed source and point
# the person to the official page or the ESB phone line. No issue is opened, so nobody is pinged.
# The schedule fires daily; a scheduled run checks only when due (a week since the last check, or the day after a run
# that could not reach a source). A manual run always checks.

on:
  schedule:
    - cron: '0 16 * * *' # daily 16:00 UTC (08:00 or 09:00 Pacific)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Get the canada-law script (statute text)
        run: |
          curl -sSL -o canada-law.tgz https://github.com/bellaaaaxu/canada-law/releases/download/v0.2.3/canada-law-0.2.3.tgz
          mkdir canada-law && tar -xzf canada-law.tgz -C canada-law --strip-components=1
          echo "CANADA_LAW_CLI=$PWD/canada-law/skills/canada-employment-law/scripts/bclaw.mjs" >> "$GITHUB_ENV"

      # A changed source is recorded, not treated as a failure: the skill handles it on its own.
      - name: Check official sources
        run: node scripts/check-sources.mjs ${{ github.event_name == 'schedule' && '--if-due' || '' }} || true

      - name: Rebuild the chat packs (check date and held-back facts)
        run: node scripts/build-chat-pack.mjs

      - name: Record the run
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/bc-unpaid-wages/references/sources.json chat/
          git diff --cached --quiet || git commit -m "Weekly source check"
          git push
